<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Knowledge Decay Tracker{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        nav { display: flex; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid #ddd; }
        nav a { margin-right: 20px; text-decoration: none; color: #333; }
        main { padding: 20px; max-width: 800px; margin: 0 auto; }
    </style>
</head>
<body>
    <nav>
        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'topic_list' %}">Topics</a>
            <a href="{% url 'test_review' %}">Tests</a>
            <a href="{% url 'test_history' %}">Test history</a>
        </div>
        <div>
            <a href="{% url 'take_test_topics' %}">Take a test</a>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
