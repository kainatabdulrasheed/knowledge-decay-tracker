{% extends 'base.html' %}

{% block title %}Edit note{% endblock %}

{% block content %}
<p><a href="{% url 'topic_detail' note.topic.pk %}">← {{ note.topic.name }}</a></p>
<h1>Edit note</h1>

<form method="POST">
    {% csrf_token %}
    <textarea name="content" rows="8" style="width: 100%;" required>{{ note.content }}</textarea>
    <br><br>
    <button type="submit">Save</button>
</form>
{% endblock %}
