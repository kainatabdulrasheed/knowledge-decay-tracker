{% extends 'base.html' %}

{% block title %}Delete note{% endblock %}

{% block content %}
<h1>Delete this note?</h1>
<p>{{ note.content|truncatewords:20 }}</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'topic_detail' note.topic.pk %}">Cancel</a>
</form>
{% endblock %}
