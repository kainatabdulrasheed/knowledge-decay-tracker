{% extends 'base.html' %}

{% block title %}Add note{% endblock %}

{% block content %}
<p><a href="{% url 'topic_detail' topic.pk %}">← {{ topic.name }}</a></p>
<h1>Add note</h1>

<form method="POST">
    {% csrf_token %}
    <textarea name="content" rows="8" style="width: 100%;" placeholder="Write your note..." required></textarea>
    <br><br>
    <button type="submit">Save</button>
</form>
{% endblock %}
