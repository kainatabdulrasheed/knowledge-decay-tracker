{% extends 'base.html' %}

{% block title %}Take a test{% endblock %}

{% block content %}
<h1>Take a test</h1>
<p>Select a topic to start.</p>

{% if topics %}
    <ul>
        {% for topic in topics %}
            <li><a href="{% url 'take_test' topic.pk %}">{{ topic.name }}</a></li>
        {% endfor %}
    </ul>
{% else %}
    <p>No topics yet. <a href="{% url 'topic_add' %}">Add a topic first</a>.</p>
{% endif %}
{% endblock %}
